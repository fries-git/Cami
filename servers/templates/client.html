<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --paper-dark:#F1E4CE;
    --ink:#2A2420;
    --ink-soft:#6b6154;
    --mustard:#E3A63E;
    --mustard-dark:#C9862A;
    --ketchup:#C1442E;
    --mint:#5F9E80;
    --line:#DCCFB4;
    --shadow:0 2px 0 rgba(42,36,32,0.06), 0 8px 20px -12px rgba(42,36,32,0.25);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(42,36,32,0.06) 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea{ font-family:inherit; }
  a{ color:var(--ketchup); }
  ::selection{ background:var(--mustard); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--ketchup); outline-offset:2px; }

  /* ---------- layout shells ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .center-shell{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }

  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brandmark .dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--mustard); border:2px solid var(--ink);
  }
  .brandmark span{ font-weight:700; font-size:22px; }

  /* ---------- auth card ---------- */
  .auth-card{
    width:100%; max-width:400px; background:var(--paper-dark);
    border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 26px 24px;
  }
  .auth-card p.tag{ color:var(--ink-soft); margin:4px 0 22px; font-size:14px; }
  .tabswitch{ display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:3px; margin-bottom:20px; }
  .tabswitch button{
    flex:1; border:none; background:transparent; padding:8px 0; border-radius:6px;
    font-weight:600; font-size:13.5px; color:var(--ink-soft);
  }
  .tabswitch button.active{ background:var(--ink); color:var(--paper); }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .field{ margin-bottom:14px; }
  input[type=text],input[type=password],textarea,select{
    width:100%; border:1px solid var(--line); background:var(--paper);
    border-radius:7px; padding:10px 12px; font-size:14.5px; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:70px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:7px; padding:10px 16px; font-weight:600; font-size:14px;
    background:var(--ink); color:var(--paper); width:100%;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.secondary{ background:var(--paper); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .btn.accent{ background:var(--mustard-dark); }
  .btn.danger{ background:var(--ketchup); }
  .btn.small{ width:auto; padding:7px 12px; font-size:13px; }
  .err-msg{ color:var(--ketchup); font-size:13px; margin-top:10px; min-height:16px; }

  details.adv{ margin-top:16px; border-top:1px dashed var(--line); padding-top:12px; }
  details.adv summary{ cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  details.adv .field{ margin-top:10px; }

  /* ---------- app shell ---------- */
  .shell{ display:flex; flex:1; min-height:100vh; }
  .sidebar{
    width:268px; flex-shrink:0; background:var(--paper-dark); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 16px;
  }
  .sidebar .brandmark{ padding:0 4px 18px; }

  .profile-ticket{
    position:relative; background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:16px 14px 20px; margin-bottom:18px;
  }
  .profile-ticket::after{
    content:""; position:absolute; left:0; right:0; bottom:-7px; height:14px;
    background:
      linear-gradient(-45deg, var(--paper-dark) 7px, transparent 0) 0 0/14px 14px repeat-x,
      linear-gradient(45deg, var(--paper-dark) 7px, transparent 0) 0 0/14px 14px repeat-x;
  }
  .profile-top{ display:flex; align-items:center; gap:10px; }
  .pfp-img{ width:46px;height:46px;border-radius:50%; object-fit:cover; border:2px solid var(--ink); background:var(--mustard); flex-shrink:0; }
  .pfp-img.lg{ width:84px; height:84px; }
  .profile-names .uname{ font-weight:700; font-size:15px; line-height:1.15; }
  .profile-names .unum{ font-size:11.5px; color:var(--ink-soft); }
  .profile-bio{ font-size:12.5px; color:var(--ink-soft); margin:10px 0 8px; line-height:1.4; }
  .fries-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    background:var(--paper-dark); border:1px dashed var(--mustard-dark); border-radius:20px; padding:3px 10px;
  }

  nav.tabs{ display:flex; flex-direction:column; gap:2px; margin-top:4px; }
  nav.tabs button{
    display:flex; align-items:center; gap:10px; text-align:left; border:none; background:transparent;
    padding:9px 10px; border-radius:7px; font-size:14px; font-weight:600; color:var(--ink-soft);
  }
  nav.tabs button:hover{ background:var(--paper); }
  nav.tabs button.active{ background:var(--ink); color:var(--paper); }
  nav.tabs .ico{ width:18px; text-align:center; }

  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .ws-status{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .ws-dot{ width:8px;height:8px;border-radius:50%; background:var(--ketchup); }
  .ws-dot.on{ background:var(--mint); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--line);
  }
  .topbar h1{ font-size:20px; margin:0; }
  .view{ flex:1; padding:24px 28px 40px; overflow-y:auto; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200;
    box-shadow:var(--shadow); max-width:80vw;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--ketchup); }

  /* ---------- feed ---------- */
  .composer{
    background:var(--paper-dark); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:22px;
  }
  .composer-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .char-count{ font-size:11.5px; color:var(--ink-soft); }
  .char-count.bad{ color:var(--ketchup); }

  .ticket{
    position:relative; background:var(--paper-dark); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px 22px; margin-bottom:22px; transition:transform .15s;
  }
  .ticket:hover{ transform:rotate(-.3deg); }
  .ticket::after{
    content:""; position:absolute; left:0; right:0; bottom:-8px; height:16px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0) 0 0/16px 16px repeat-x,
      linear-gradient(45deg, var(--paper) 8px, transparent 0) 0 0/16px 16px repeat-x;
  }
  .ticket-head{ display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px dashed var(--line); margin-bottom:10px; }
  .ticket-head .pfp-img{ width:30px;height:30px; }
  .ticket-head .who{ font-weight:600; font-size:13.5px; }
  .ticket-head .when{ font-size:11px; color:var(--ink-soft); margin-left:auto; }
  .ticket-order{ font-size:10.5px; color:var(--ink-soft); }
  .ticket-body{ font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .glyph{ font-size:30px; margin-bottom:8px; }

  /* ---------- users ---------- */
  .user-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .user-chip{
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    background:var(--paper-dark); border:1px solid var(--line); border-radius:8px; padding:16px 10px;
    border:none; font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .user-chip:hover{ background:var(--paper); }
  .user-chip .pfp-img{ width:52px;height:52px; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(42,36,32,0.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:150;
  }
  .modal{
    background:var(--paper); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow);
    width:100%; max-width:360px; padding:22px; text-align:center; position:relative;
  }
  .modal .close-x{ position:absolute; top:10px; right:12px; background:none; border:none; font-size:18px; color:var(--ink-soft); }
  .modal .uname{ font-size:18px; font-weight:700; margin:12px 0 2px; }
  .modal .unum{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .modal .bio{ font-size:13.5px; color:var(--ink); background:var(--paper-dark); border-radius:7px; padding:10px 12px; margin-bottom:12px; text-align:left; }

  /* ---------- chat ---------- */
  .chat-shell{ display:flex; flex-direction:column; height:calc(100vh - 130px); max-height:720px; }
  .chan-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; }
  .chan-row .field{ margin:0; }
  .chan-row .field.grow{ flex:1; min-width:140px; }
  .chan-badge{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .chan-badge b{ color:var(--ink); }

  .chat-log{
    flex:1; overflow-y:auto; background:var(--paper-dark); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .msg-row{ display:flex; }
  .msg-row.mine{ justify-content:flex-end; }
  .bubble{
    max-width:70%; background:var(--paper); border:1px solid var(--line); border-radius:10px 10px 10px 3px;
    padding:8px 12px; font-size:14px;
  }
  .msg-row.mine .bubble{ background:var(--mustard); border-color:var(--mustard-dark); border-radius:10px 10px 3px 10px; }
  .bubble .who{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
  .msg-row.mine .bubble .who{ color:rgba(42,36,32,0.6); }
  .sys-row{ align-self:center; font-size:11.5px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line); border-radius:20px; padding:3px 12px; }

  .chat-input-row{ display:flex; gap:8px; margin-top:12px; }
  .chat-input-row input{ flex:1; }

  /* ---------- settings ---------- */
  .settings-grid{ display:grid; gap:20px; max-width:520px; }
  .settings-card{ background:var(--paper-dark); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
  .settings-card h3{ margin:0 0 4px; font-size:15px; }
  .settings-card .hint{ font-size:12px; color:var(--ink-soft); margin:0 0 14px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  @media (max-width:760px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; padding:14px; }
    .sidebar .brandmark{ padding:0; width:100%; margin-bottom:10px; }
    .profile-ticket{ width:100%; }
    nav.tabs{ flex-direction:row; width:100%; overflow-x:auto; }
    .sidebar-foot{ width:100%; }
    .view{ padding:18px; }
    .chat-shell{ height:calc(100vh - 260px); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Cami client — talks to the REST API (auth/profile/feed/pfp)
   and the websocket chat server, sharing one auth token.
   ============================================================ */

function guessApiBase(){
  return("https://cami.barfpile.dev")
}
function guessWsBase(){
  return("wss://chat.barfpile.dev")
}

const state = {
  apiBase: guessApiBase(),
  wsBase: guessWsBase(),
  token: null,
  username: null,
  profile: null,
  ws: null,
  wsConnected: false,
  wsRetry: 0,
  wsRetryTimer: null,
  currentChannel: 'general',
  currentChannelPassword: '',
  userCache: {},   // key (username or userid) -> {username, userid, bio, usernum, fries}
  posts: [],
  postsOffset: 0,
  postsExhausted: false,
  activeTab: 'feed',
};

const root = document.getElementById('app');

/* ---------------- helpers ---------------- */

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.className = '', 2600);
}

async function api(path, opts={}){
  const res = await fetch(state.apiBase + path, opts);
  const text = await res.text();
  let data = text;
  try { data = JSON.parse(text); } catch(e){ /* plain text response */ }
  if(!res.ok){
    const msg = typeof data === 'string' ? data : (data.error || JSON.stringify(data));
    throw new Error(msg || `Request failed (${res.status})`);
  }
  return data;
}

function timeAgo(unixSeconds){
  const diff = Math.max(0, Math.floor(Date.now()/1000) - unixSeconds);
  if(diff < 60) return `${diff}s ago`;
  if(diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if(diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hashHue(str){
  let h = 0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}
function avatarDataUri(letter, seed){
  const hue = hashHue(seed || letter || '?');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(${hue},55%,62%)"/><text x="50%" y="54%" font-family="Space Grotesk,sans-serif" font-size="34" font-weight="700" fill="#2A2420" text-anchor="middle" dominant-baseline="middle">${letter.toUpperCase()}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function pfpUrl(username){
  return `${state.apiBase}/userpfp?user=${encodeURIComponent(username)}&_=${pfpUrl._bust||''}`;
}
function pfpImg(username, cls){
  const letter = (username||'?').charAt(0);
  return `<img class="pfp-img ${cls||''}" data-fallback-letter="${escapeHtml(letter)}" data-fallback-seed="${escapeHtml(username||'?')}" src="${pfpUrl(username)}" alt="${escapeHtml(username||'')}'s avatar">`;
}
// event delegation for broken pfp images (error doesn't bubble, so use capture)
root.addEventListener('error', (e)=>{
  const t = e.target;
  if(t && t.tagName === 'IMG' && t.classList.contains('pfp-img') && !t.dataset.fallbackApplied){
    t.dataset.fallbackApplied = '1';
    t.src = avatarDataUri(t.dataset.fallbackLetter || '?', t.dataset.fallbackSeed);
  }
}, true);

async function resolveUser(idOrName){
  if(state.userCache[idOrName]) return state.userCache[idOrName];
  try{
    const u = await api(`/user?user=${encodeURIComponent(idOrName)}`);
    state.userCache[u.username] = u;
    state.userCache[u.userid] = u;
    return u;
  }catch(e){
    return { username: idOrName, userid: idOrName, bio:'', usernum:'?', fries:0 };
  }
}

/* ---------------- auth screen ---------------- */

function renderAuth(mode){
  mode = mode || 'login';
  root.innerHTML = `
    <div class="center-shell">
      <div class="auth-card">
        <div class="brandmark"><span class="dot"></span><span class="display">Cami</span></div>
        <p class="tag">One counter for your account, feed and table chat.</p>
        <div class="tabswitch">
          <button data-mode="login" class="${mode==='login'?'active':''}">Log in</button>
          <button data-mode="register" class="${mode==='register'?'active':''}">Register</button>
        </div>
        <form id="auth-form">
          <div class="field">
            <label for="f-user">Username</label>
            <input type="text" id="f-user" autocomplete="username" required minlength="4">
          </div>
          <div class="field">
            <label for="f-pass">Password</label>
            <input type="password" id="f-pass" autocomplete="${mode==='login'?'current-password':'new-password'}" required minlength="4">
          </div>
          <button class="btn accent" type="submit">${mode==='login'?'Log in':'Create account'}</button>
          <div class="err-msg" id="auth-err"></div>
        </form>
        <details class="adv">
          <summary>Connection settings</summary>
          <div class="field">
            <label for="cfg-api">API base URL</label>
            <input type="text" id="cfg-api" value="${escapeHtml(state.apiBase)}">
          </div>
          <div class="field">
            <label for="cfg-ws">Chat (websocket) URL</label>
            <input type="text" id="cfg-ws" value="${escapeHtml(state.wsBase)}">
          </div>
        </details>
      </div>
    </div>`;

  document.querySelectorAll('.tabswitch button').forEach(b=>{
    b.addEventListener('click', ()=> renderAuth(b.dataset.mode));
  });
  document.getElementById('cfg-api').addEventListener('change', e => state.apiBase = e.target.value.trim().replace(/\/$/,''));
  document.getElementById('cfg-ws').addEventListener('change', e => state.wsBase = e.target.value.trim().replace(/\/$/,''));

  document.getElementById('auth-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('f-user').value.trim();
    const password = document.getElementById('f-pass').value;
    const errEl = document.getElementById('auth-err');
    errEl.textContent = '';
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try{
      const token = await api(mode==='login' ? '/login' : '/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username, password})
      });
      state.token = token;
      state.username = username;
      state.profile = await resolveUser(username);
      toast(mode==='login' ? `Welcome back, ${username}.` : `Account created — welcome, ${username}.`);
      renderApp();
      connectWs();
    }catch(err){
      errEl.textContent = err.message;
    }finally{
      btn.disabled = false;
    }
  });
}

/* ---------------- app shell ---------------- */

function renderApp(){
  root.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brandmark"><span class="dot"></span><span class="display">Cami</span></div>
        <div class="profile-ticket" id="profile-ticket"></div>
        <nav class="tabs">
          <button data-tab="feed"><span class="ico">&#128220;</span> Feed</button>
          <button data-tab="chat"><span class="ico">&#128172;</span> Chat</button>
          <button data-tab="users"><span class="ico">&#128101;</span> Users</button>
          <button data-tab="settings"><span class="ico">&#9881;</span> Settings</button>
        </nav>
        <div class="sidebar-foot">
          <div class="ws-status"><span class="ws-dot" id="ws-dot"></span><span id="ws-label">connecting…</span></div>
          <button class="btn small secondary" id="logout-btn">Log out</button>
        </div>
      </aside>
      <main class="main">
        <div class="topbar"><h1 id="view-title">Feed</h1></div>
        <div class="view" id="view"></div>
      </main>
    </div>`;

  renderProfileTicket();
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=> switchTab(b.dataset.tab));
  });
  switchTab('feed');
}

function renderProfileTicket(){
  const p = state.profile || {};
  document.getElementById('profile-ticket').innerHTML = `
    <div class="profile-top">
      ${pfpImg(state.username)}
      <div class="profile-names">
        <div class="uname">${escapeHtml(state.username)}</div>
        <div class="unum mono">user #${escapeHtml(String(p.usernum ?? '?'))}</div>
      </div>
    </div>
    <div class="profile-bio">${escapeHtml(p.bio || '')}</div>
    <div class="fries-badge">&#127839; ${escapeHtml(String(p.fries ?? 0))} fries</div>`;
}

function switchTab(tab){
  state.activeTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const titles = { feed:'Feed', chat:'Chat', users:'Users', settings:'Settings' };
  document.getElementById('view-title').textContent = titles[tab];
  if(tab==='feed') renderFeedView();
  if(tab==='chat') renderChatView();
  if(tab==='users') renderUsersView();
  if(tab==='settings') renderSettingsView();
}

async function doLogout(){
  try{ await api('/logout', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token: state.token})}); }
  catch(e){ /* ignore, log out locally regardless */ }
  if(state.ws){ state.ws.onclose = null; state.ws.close(); }
  clearTimeout(state.wsRetryTimer);
  Object.assign(state, { token:null, username:null, profile:null, ws:null, wsConnected:false, wsRetry:0,
    currentChannel:'general', currentChannelPassword:'', userCache:{}, posts:[], postsOffset:0, postsExhausted:false });
  toast('Logged out.');
  renderAuth('login');
}

/* ---------------- feed ---------------- */

function renderFeedView(){
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="composer">
      <label for="post-body">New post</label>
      <textarea id="post-body" maxlength="200" placeholder="What's on the menu today?"></textarea>
      <div class="composer-foot">
        <span class="char-count" id="char-count">0 / 200 (min 10)</span>
        <button class="btn accent small" id="post-submit" disabled>Post</button>
      </div>
    </div>
    <div id="posts-list"></div>
    <div style="text-align:center; margin-top:6px;">
      <button class="btn secondary small" id="load-more">Load more</button>
    </div>`;

  const ta = document.getElementById('post-body');
  const cc = document.getElementById('char-count');
  const submitBtn = document.getElementById('post-submit');
  ta.addEventListener('input', ()=>{
    const n = ta.value.length;
    cc.textContent = `${n} / 200 (min 10)`;
    const ok = n>=10 && n<=200;
    cc.classList.toggle('bad', !ok && n>0);
    submitBtn.disabled = !ok;
  });
  document.getElementById('post-submit').addEventListener('click', async ()=>{
    submitBtn.disabled = true;
    try{
      const postid = await api('/social', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({body: ta.value, token: state.token})
      });
      state.posts.unshift({ postid, body: ta.value, timestamp: Math.floor(Date.now()/1000), userid: state.profile.userid });
      ta.value=''; cc.textContent = '0 / 200 (min 10)'; cc.classList.remove('bad');
      toast('Posted.');
      renderPostsList();
    }catch(err){ toast(err.message, true); }
    finally{ submitBtn.disabled = false; }
  });

  document.getElementById('load-more').addEventListener('click', loadMorePosts);

  state.posts = []; state.postsOffset = 0; state.postsExhausted = false;
  loadMorePosts();
}

async function loadMorePosts(){
  const btn = document.getElementById('load-more');
  if(btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try{
    const batch = await api(`/social?count=10&offset=${state.postsOffset}`);
    if(Array.isArray(batch) && batch.length){
      state.posts.push(...batch);
      state.postsOffset += batch.length;
      if(batch.length < 10) state.postsExhausted = true;
    } else {
      state.postsExhausted = true;
    }
  }catch(e){
    state.postsExhausted = true;
  }
  renderPostsList();
  if(btn){ btn.disabled = state.postsExhausted; btn.textContent = state.postsExhausted ? 'No more posts' : 'Load more'; }
}

async function renderPostsList(){
  const list = document.getElementById('posts-list');
  if(!list) return;
  if(!state.posts.length){
    list.innerHTML = `<div class="empty-state"><div class="glyph">&#127828;</div>Nothing on the board yet. Be the first to post.</div>`;
    return;
  }
  list.innerHTML = state.posts.map((p,i)=>`
    <article class="ticket" data-postid="${escapeHtml(p.postid)}">
      <div class="ticket-head">
        <span class="pfp-holder" data-userid="${escapeHtml(p.userid)}"></span>
        <span class="who" data-userid-label="${escapeHtml(p.userid)}">…</span>
        <span class="when">${escapeHtml(timeAgo(p.timestamp))}</span>
      </div>
      <div class="ticket-body">${escapeHtml(p.body)}</div>
      <div class="ticket-order mono">order #${String(i+1).padStart(3,'0')}</div>
    </article>`).join('');

  // resolve usernames for each post's userid, then patch DOM
  const uniqueIds = [...new Set(state.posts.map(p=>p.userid))];
  await Promise.all(uniqueIds.map(async id=>{
    const u = await resolveUser(id);
    list.querySelectorAll(`[data-userid-label="${cssEscape(id)}"]`).forEach(el=> el.textContent = u.username);
    list.querySelectorAll(`[data-userid="${cssEscape(id)}"].pfp-holder`).forEach(el=> el.outerHTML = pfpImg(u.username));
  }));
}
function cssEscape(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* ---------------- users ---------------- */

async function renderUsersView(){
  const view = document.getElementById('view');
  view.innerHTML = `<div class="user-grid" id="user-grid"><div class="empty-state">Loading…</div></div>`;
  try{
    const usernames = await api('/users');
    const grid = document.getElementById('user-grid');
    if(!usernames.length){ grid.innerHTML = `<div class="empty-state">No users yet.</div>`; return; }
    grid.innerHTML = usernames.map(name => `
      <button class="user-chip" data-user="${escapeHtml(name)}">
        ${pfpImg(name)}
        <span>${escapeHtml(name)}</span>
      </button>`).join('');
    grid.querySelectorAll('.user-chip').forEach(chip=>{
      chip.addEventListener('click', ()=> openUserModal(chip.dataset.user));
    });
  }catch(err){
    document.getElementById('user-grid').innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
  }
}

async function openUserModal(username){
  const u = await resolveUser(username);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <button class="close-x" aria-label="Close">&times;</button>
      ${pfpImg(u.username,'lg')}
      <div class="uname">${escapeHtml(u.username)}</div>
      <div class="unum mono">user #${escapeHtml(String(u.usernum))} &middot; &#127839; ${escapeHtml(String(u.fries))} fries</div>
      <div class="bio">${escapeHtml(u.bio || 'No bio yet.')}</div>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('.close-x').addEventListener('click', ()=> backdrop.remove());
  document.body.appendChild(backdrop);
}

/* ---------------- chat ---------------- */

function renderChatView(){
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="chat-shell">
      <div class="chan-row">
        <div class="field grow">
          <label for="chan-name">Channel</label>
          <input type="text" id="chan-name" value="${escapeHtml(state.currentChannel)}">
        </div>
        <div class="field grow">
          <label for="chan-pass">Password (if any)</label>
          <input type="text" id="chan-pass" value="${escapeHtml(state.currentChannelPassword)}">
        </div>
        <button class="btn accent small" id="chan-join">Join</button>
      </div>
      <div class="chan-badge">Currently in <b>#${escapeHtml(state.currentChannel)}</b> — new connections auto-join #general.</div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Say something…" maxlength="500">
        <button class="btn accent small" id="chat-send">Send</button>
      </div>
    </div>`;

  document.getElementById('chan-join').addEventListener('click', ()=>{
    const ch = document.getElementById('chan-name').value.trim() || 'general';
    const pw = document.getElementById('chan-pass').value;
    joinChannel(ch, pw);
  });
  const sendBtn = document.getElementById('chat-send');
  const input = document.getElementById('chat-input');
  const doSend = ()=>{
    const msg = input.value.trim();
    if(!msg) return;
    sendChatMessage(msg);
    input.value = '';
  };
  sendBtn.addEventListener('click', doSend);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });

  if(!state.wsConnected) connectWs();
  renderChatLogSystem(`Connected as ${state.username}. Listening on #${state.currentChannel}.`);
}

function chatLogEl(){ return document.getElementById('chat-log'); }

function renderChatLogSystem(text){
  const log = chatLogEl();
  if(!log) return;
  const div = document.createElement('div');
  div.className = 'sys-row';
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function renderChatBubble(userid, message){
  const log = chatLogEl();
  if(!log) return;
  const mine = state.profile && userid === state.profile.userid;
  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '');
  row.innerHTML = `<div class="bubble"><div class="who">…</div>${escapeHtml(message)}</div>`;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  const u = await resolveUser(userid || 'unknown');
  const who = row.querySelector('.who');
  if(who) who.textContent = mine ? 'you' : u.username;
}

function joinChannel(channel, password){
  if(!state.ws || !state.wsConnected){ toast('Not connected yet — hang tight.', true); return; }
  state.ws.send(JSON.stringify({ type:'joinchannel', channel, password }));
  state.currentChannel = channel;
  state.currentChannelPassword = password;
  const badge = document.querySelector('.chan-badge');
  if(badge) badge.innerHTML = `Currently in <b>#${escapeHtml(channel)}</b> — new connections auto-join #general.`;
  renderChatLogSystem(`Joined #${channel}.`);
}

function sendChatMessage(msg){
  if(!state.ws || !state.wsConnected){ toast('Not connected yet — hang tight.', true); return; }
  state.ws.send(JSON.stringify({
    type:'send', channel: state.currentChannel, password: state.currentChannelPassword,
    msg, token: state.token
  }));
}

function setWsIndicator(connected, label){
  const dot = document.getElementById('ws-dot');
  const lbl = document.getElementById('ws-label');
  if(dot) dot.classList.toggle('on', connected);
  if(lbl) lbl.textContent = label;
}

function connectWs(){
  if(state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  clearTimeout(state.wsRetryTimer);
  setWsIndicator(false, 'connecting…');
  let ws;
  try{
    ws = new WebSocket(state.wsBase);
  }catch(e){
    setWsIndicator(false, 'unavailable');
    toast('Could not open chat connection: ' + e.message, true);
    return;
  }
  state.ws = ws;

  ws.onopen = ()=>{
    state.wsConnected = true;
    state.wsRetry = 0;
    setWsIndicator(true, `#${state.currentChannel}`);
  };
  ws.onmessage = (evt)=>{
    let data;
    try{ data = JSON.parse(evt.data); }
    catch(e){ renderChatLogSystem(String(evt.data)); return; }
    if(data && data.type === 'newmsg'){
      renderChatBubble(data.userid, data.message);
    }
  };
  ws.onclose = ()=>{
    state.wsConnected = false;
    setWsIndicator(false, 'reconnecting…');
    const delay = Math.min(1000 * (2 ** state.wsRetry), 15000);
    state.wsRetry++;
    state.wsRetryTimer = setTimeout(connectWs, delay);
  };
  ws.onerror = ()=>{ /* onclose will follow and handle retry */ };
}

/* ---------------- settings ---------------- */

function renderSettingsView(){
  const view = document.getElementById('view');
  const p = state.profile || {};
  view.innerHTML = `
    <div class="settings-grid">
      <div class="settings-card">
        <h3>Bio</h3>
        <p class="hint">Shown on your profile. 200 characters max.</p>
        <div class="field">
          <textarea id="bio-input" maxlength="200">${escapeHtml(p.bio || '')}</textarea>
        </div>
        <button class="btn accent small" id="bio-save">Save bio</button>
      </div>

      <div class="settings-card">
        <h3>Profile picture</h3>
        <p class="hint">Square crop, resized automatically.</p>
        <div style="display:flex; align-items:center; gap:14px;">
          ${pfpImg(state.username, 'lg')}
          <div>
            <input type="file" id="pfp-input" accept="image/*">
            <div style="margin-top:8px;"><button class="btn secondary small" id="pfp-save">Upload</button></div>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <h3>Change password</h3>
        <div class="row2">
          <div class="field"><label for="pass-old">Current</label><input type="password" id="pass-old"></div>
          <div class="field"><label for="pass-new">New</label><input type="password" id="pass-new" minlength="4"></div>
        </div>
        <button class="btn secondary small" id="pass-save">Update password</button>
      </div>

      <div class="settings-card">
        <h3>Connection</h3>
        <p class="hint">Where this client looks for the API and chat servers.</p>
        <div class="field"><label for="set-api">API base URL</label><input type="text" id="set-api" value="${escapeHtml(state.apiBase)}"></div>
        <div class="field"><label for="set-ws">Chat (websocket) URL</label><input type="text" id="set-ws" value="${escapeHtml(state.wsBase)}"></div>
        <button class="btn secondary small" id="conn-save">Apply &amp; reconnect chat</button>
      </div>

      <div class="settings-card">
        <h3>Account</h3>
        <button class="btn danger small" id="logout-2">Log out</button>
      </div>
    </div>`;

  document.getElementById('bio-save').addEventListener('click', async ()=>{
    const val = document.getElementById('bio-input').value;
    try{
      await api('/updatebio', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token: state.token, newbio: val}) });
      state.profile.bio = val;
      delete state.userCache[state.username];
      renderProfileTicket();
      toast('Bio updated.');
    }catch(err){ toast(err.message, true); }
  });

  document.getElementById('pfp-save').addEventListener('click', async ()=>{
    const file = document.getElementById('pfp-input').files[0];
    if(!file){ toast('Choose an image first.', true); return; }
    const fd = new FormData();
    fd.append('token', state.token);
    fd.append('image', file);
    try{
      await fetch(state.apiBase + '/setpfp', { method:'POST', body: fd })
        .then(async res=>{
          if(!res.ok) throw new Error(await res.text());
        });
      pfpUrl._bust = Date.now();
      toast('Profile picture updated.');
      renderProfileTicket();
      renderSettingsView();
    }catch(err){ toast(err.message, true); }
  });

  document.getElementById('pass-save').addEventListener('click', async ()=>{
    const oldpass = document.getElementById('pass-old').value;
    const newpass = document.getElementById('pass-new').value;
    try{
      await api(`/changepass?token=${encodeURIComponent(state.token)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({oldpass, newpass})
      });
      toast('Password updated.');
      document.getElementById('pass-old').value = '';
      document.getElementById('pass-new').value = '';
    }catch(err){ toast(err.message, true); }
  });

  document.getElementById('conn-save').addEventListener('click', ()=>{
    state.apiBase = document.getElementById('set-api').value.trim().replace(/\/$/,'');
    state.wsBase = document.getElementById('set-ws').value.trim().replace(/\/$/,'');
    if(state.ws){ state.ws.onclose = null; state.ws.close(); }
    state.wsConnected = false; state.wsRetry = 0;
    connectWs();
    toast('Connection settings applied.');
  });

  document.getElementById('logout-2').addEventListener('click', doLogout);
}

/* ---------------- boot ---------------- */
renderAuth('login');
</script>

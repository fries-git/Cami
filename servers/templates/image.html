```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Server Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        width: min(600px, 92vw);
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 10px 40px #0008;
    }

    h1 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        color: #aaa;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
        color: white;
        font-size: 15px;
    }

    input[type="file"] {
        padding: 8px;
    }

    button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #eee;
        color: #111;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #ccc;
    }

    #status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #111;
        white-space: pre-wrap;
        font-family: monospace;
    }

    #preview-container {
        margin-top: 20px;
        text-align: center;
    }

    #preview {
        max-width: 100%;
        max-height: 400px;
        border-radius: 10px;
        border: 1px solid #333;
    }

    .url {
        margin-top: 10px;
        padding: 10px;
        background: #111;
        border-radius: 8px;
        word-break: break-all;
        font-family: monospace;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="box">
    <h1>🖼️ Image Server</h1>

    <label for="api">API URL</label>
    <input
        id="api"
        value="http://localhost:5614"
        placeholder="http://localhost:5614"
    >

    <label for="token">Token</label>
    <input
        id="token"
        type="password"
        placeholder="Your token"
    >

    <label for="filename">Filename</label>
    <input
        id="filename"
        placeholder="my-image"
    >

    <label for="image">Image</label>
    <input
        id="image"
        type="file"
        accept="image/*"
    >

    <button onclick="upload()">Upload</button>

    <div id="status">Waiting...</div>

    <div id="preview-container">
        <img id="preview" style="display:none;">
        <div id="url" class="url" style="display:none;"></div>
    </div>
</div>

<script>
async function upload() {
    const api = document.getElementById("api").value.replace(/\/+$/, "");
    const token = document.getElementById("token").value;
    const filename = document.getElementById("filename").value.trim();
    const image = document.getElementById("image").files[0];

    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const urlBox = document.getElementById("url");

    if (!token) {
        status.textContent = "❌ Enter a token.";
        return;
    }

    if (!filename) {
        status.textContent = "❌ Enter a filename.";
        return;
    }

    if (!image) {
        status.textContent = "❌ Select an image.";
        return;
    }

    status.textContent = "Uploading...";
    preview.style.display = "none";
    urlBox.style.display = "none";

    const form = new FormData();

    form.append("token", token);
    form.append("filename", filename);
    form.append("image", image);

    try {
        const response = await fetch(`${api}/uploadimage`, {
            method: "POST",
            body: form
        });

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = text;
        }

        if (!response.ok) {
            status.textContent =
                `❌ Upload failed (${response.status})\n\n${text}`;
            return;
        }

        status.textContent =
            `✅ Upload successful!\n\n${text}`;

        let extension = "png";

        if (
            image.type === "image/gif" ||
            String(data.filename || "").toLowerCase().endsWith(".gif")
        ) {
            extension = "gif";
        }

        const imageURL =
            `${api}/getimage/${encodeURIComponent(filename)}`;

        preview.src = imageURL;
        preview.style.display = "block";

        urlBox.textContent = imageURL;
        urlBox.style.display = "block";

    } catch (error) {
        status.textContent =
            `❌ Request failed:\n\n${error}`;
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cami</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0e0e0e;
    --panel:#171717;
    --panel2:#202020;
    --border:#2b2b2b;
    --text:#f5f2ea;
    --muted:#99958c;
    --accent:#ff8c42;
    --accent2:#e8752f;
    --danger:#d95757;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.authbox{
    width:100%;
    max-width:410px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px #0008;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo span{
    color:var(--accent);
}

.authbox .logo{
    margin-bottom:26px;
}

.authbox h2{
    margin:0 0 20px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
}

input,textarea{
    width:100%;
    background:#101010;
    border:1px solid var(--border);
    color:white;
    border-radius:10px;
    padding:12px;
    outline:none;
    transition:.15s;
}

input:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px #ff8c4215;
}

textarea{
    resize:vertical;
    min-height:92px;
}

button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    font-weight:750;
    transition:.15s;
}

.primary{
    background:var(--accent);
    color:#111;
}

.primary:hover{
    background:var(--accent2);
    transform:translateY(-1px);
}

.secondary{
    background:var(--panel2);
    color:white;
}

.secondary:hover{
    background:#292929;
}

.danger{
    background:#321b1b;
    color:#ff9292;
}

.danger:hover{
    background:#452020;
}

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:235px;
    border-right:1px solid var(--border);
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    background:#131313;
}

.sidebar .logo{
    padding:4px 10px 28px;
}

.nav{
    display:grid;
    gap:5px;
}

.nav button{
    background:transparent;
    color:#aaa;
    text-align:left;
    padding:12px 13px;
}

.nav button:hover,
.nav button.active{
    background:var(--panel2);
    color:white;
}

.account{
    margin-top:auto;
    background:var(--panel);
    border:1px solid var(--border);
    padding:13px;
    border-radius:12px;
}

.account b{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
}

.account small{
    color:var(--muted);
}

.main{
    flex:1;
    max-width:900px;
    margin:auto;
    padding:32px;
    width:100%;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    margin:0;
    letter-spacing:-.8px;
}

h2{
    font-size:20px;
    margin:0 0 15px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    margin-bottom:14px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    align-items:center;
    flex-wrap:wrap;
}

.muted{
    color:var(--muted);
}

.post-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.post-user{
    font-weight:800;
}

.post-time{
    color:var(--muted);
    font-size:12px;
}

.post-body{
    white-space:pre-wrap;
    margin-top:10px;
    line-height:1.5;
    color:#ddd;
}

.user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--border);
}

.user:last-child{
    border-bottom:0;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#292929;
}

.profile-head{
    display:flex;
    align-items:center;
    gap:13px;
}

.profile-head .avatar{
    width:58px;
    height:58px;
}

.stat{
    font-size:28px;
    font-weight:850;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modalbox{
    width:100%;
    max-width:390px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    box-shadow:0 20px 60px #0009;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#252525;
    border:1px solid #3a3a3a;
    padding:12px 15px;
    border-radius:10px;
    z-index:20;
    max-width:340px;
    box-shadow:0 10px 30px #0007;
}

@media(max-width:700px){
    .sidebar{
        width:64px;
        padding:14px 8px;
    }

    .sidebar .logo{
        font-size:0;
        text-align:center;
        padding:4px 0 20px;
    }

    .sidebar .logo span{
        font-size:25px;
    }

    .nav button{
        font-size:0;
        text-align:center;
        padding:12px;
    }

    .nav button::first-letter{
        font-size:20px;
    }

    .account{
        display:none;
    }

    .main{
        padding:20px 14px;
    }

    .row{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="auth" class="auth">
    <div class="authbox">
        <div class="logo">Cami<span>.</span></div>

        <h2 id="authTitle">Log in</h2>

        <div class="field">
            <label>Username</label>
            <input id="authUser" autocomplete="username">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="authPass" type="password" autocomplete="current-password">
        </div>

        <button
            id="authButton"
            class="primary"
            style="width:100%;margin-top:5px"
            onclick="authSubmit()"
        >
            Log in
        </button>

        <p class="muted" style="text-align:center;font-size:13px;margin-bottom:0">
            <span id="authSwitch">Need an account?</span>
            <button
                class="secondary"
                style="padding:5px 8px"
                onclick="toggleAuth()"
            >
                Register
            </button>
        </p>
    </div>
</div>

<div id="app" class="app hidden">

    <aside class="sidebar">
        <div class="logo">Cami<span>.</span></div>

        <nav class="nav">
            <button class="active" onclick="showPage('feed',this)">🏠 Feed</button>
            <button onclick="showPage('users',this)">👥 Users</button>
            <button onclick="showPage('profile',this)">👤 Profile</button>
            <button onclick="showPage('settings',this)">⚙️ Settings</button>
        </nav>

        <div class="account">
            <b id="sideName">-</b>
            <small id="sideFries">0 fries</small>
        </div>
    </aside>

    <main class="main">

        <section id="feed" class="page">
            <div class="top">
                <h1>Feed</h1>
                <button class="secondary" onclick="loadFeed()">Refresh</button>
            </div>

            <div class="card">
                <textarea
                    id="postText"
                    maxlength="200"
                    placeholder="What's happening? (10–200 characters)"
                ></textarea>

                <div class="actions">
                    <button class="primary" onclick="makePost()">Post</button>
                    <span class="muted" id="postCount">0/200</span>
                </div>
            </div>

            <div id="posts"></div>
        </section>

        <section id="users" class="page hidden">
            <div class="top">
                <h1>Users</h1>
                <button class="secondary" onclick="loadUsers()">Refresh</button>
            </div>

            <div class="card" id="userList"></div>
        </section>

        <section id="profile" class="page hidden">
            <div class="top">
                <h1>Profile</h1>
                <button class="secondary" onclick="loadProfile()">Refresh</button>
            </div>

            <div id="profileCard"></div>

            <div class="card">
                <h2>Daily fries</h2>
                <p class="muted">Claim 10 fries every 24 hours.</p>
                <button class="primary" onclick="daily()">Claim daily</button>
            </div>

            <div class="card">
                <h2>Transfer fries</h2>

                <div class="row">
                    <input id="recipient" placeholder="Username">
                    <input id="amount" type="number" min="1" step="1" placeholder="Amount">
                </div>

                <div class="actions">
                    <button class="primary" onclick="transfer()">Transfer</button>
                </div>
            </div>
        </section>

        <section id="settings" class="page hidden">
            <div class="top">
                <h1>Settings</h1>
            </div>

            <div class="card">
                <h2>Profile picture</h2>

                <div class="profile-head" style="margin-bottom:14px">
                    <img class="avatar" id="pfpPreview" alt="Your profile picture">

                    <span class="muted">
                        Square images work best — it'll be
                        cropped to a square and resized to 128×128.
                    </span>
                </div>

                <input type="file" id="pfpFile" accept="image/png,image/jpeg,image/webp">

                <div class="actions">
                    <button class="primary" onclick="uploadPfp()">Upload</button>
                </div>
            </div>

            <div class="card">
                <h2>Display name</h2>

                <input id="displayName">

                <div class="actions">
                    <button class="primary" onclick="changeDisplay()">Save</button>
                </div>
            </div>

            <div class="card">
                <h2>Bio</h2>

                <textarea id="bio" maxlength="200"></textarea>

                <div class="actions">
                    <button class="primary" onclick="changeBio()">Save</button>
                </div>
            </div>

            <div class="card">
                <h2>Username</h2>

                <input id="newUsername">

                <div class="actions">
                    <button class="primary" onclick="changeUsername()">
                        Change username
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>Password</h2>

                <div class="field">
                    <input
                        id="oldPass"
                        type="password"
                        placeholder="Current password"
                    >
                </div>

                <input
                    id="newPass"
                    type="password"
                    placeholder="New password"
                >

                <div class="actions">
                    <button class="primary" onclick="changePassword()">
                        Change password
                    </button>
                </div>
            </div>

            <div class="card">
                <button class="danger" onclick="logout()">Log out</button>
            </div>
        </section>

    </main>
</div>

<div
    id="modal"
    class="modal hidden"
    onclick="if(event.target===this)closeModal()"
>
    <div class="modalbox" id="modalContent"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const API = "https://fries.hackclub.app";

let token = localStorage.getItem("cami_token");
let username = localStorage.getItem("cami_username");
let authRegister = false;
let me = null;

async function api(path, options={}){
    const res = await fetch(API + path, options);

    let data = {};

    try{
        data = await res.json();
    }catch{}

    if(!res.ok){
        throw new Error(
            data.message ||
            data.error ||
            `Request failed (${res.status})`
        );
    }

    if(data.cmd === "error"){
        throw new Error(data.message || "Request failed.");
    }

    return data.cmd === "success" ? data.message : data;
}

function json(path, body, method="POST"){
    return api(path,{
        method,
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
    });
}

function toast(msg){
    const el=document.getElementById("toast");

    el.textContent=msg;
    el.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(
        ()=>el.classList.add("hidden"),
        3000
    );
}

function toggleAuth(){
    authRegister=!authRegister;

    document.getElementById("authTitle").textContent=
        authRegister ? "Create account" : "Log in";

    document.getElementById("authButton").textContent=
        authRegister ? "Register" : "Log in";

    document.getElementById("authSwitch").textContent=
        authRegister
        ? "Already have an account?"
        : "Need an account?";

    document.querySelector(".authbox p button").textContent=
        authRegister ? "Log in" : "Register";

    document.getElementById("authPass").autocomplete=
        authRegister ? "new-password" : "current-password";
}

async function authSubmit(){
    const usernameInput=
        document.getElementById("authUser").value.trim();

    const password=
        document.getElementById("authPass").value;

    if(!usernameInput || !password){
        toast("Enter a username and password.");
        return;
    }

    // Mirrors the server's 4–32 character rule so bad input is
    // caught immediately instead of round-tripping to the API.
    if(
        usernameInput.length < 4 || usernameInput.length > 32 ||
        password.length < 4 || password.length > 32
    ){
        toast("Username and password must be 4–32 characters.");
        return;
    }

    try{
        const result=await json(
            authRegister ? "/register" : "/login",
            {
                username:usernameInput,
                password
            }
        );

        if(authRegister){
            toast("Account created. You can log in now.");
            toggleAuth();
            return;
        }

        token=result;

        if(typeof token==="object"){
            token=token.token;
        }

        if(!token){
            throw new Error("Login did not return a token.");
        }

        username=usernameInput;

        localStorage.setItem("cami_token",token);
        localStorage.setItem("cami_username",username);

        start();

    }catch(e){
        toast(e.message);
    }
}

function showPage(id,btn){
    document
        .querySelectorAll(".page")
        .forEach(x=>x.classList.add("hidden"));

    document
        .getElementById(id)
        .classList.remove("hidden");

    document
        .querySelectorAll(".nav button")
        .forEach(x=>x.classList.remove("active"));

    if(btn){
        btn.classList.add("active");
    }

    if(id==="feed") loadFeed();
    if(id==="users") loadUsers();
    if(id==="profile") loadProfile();
}

async function loadFeed(){
    try{
        const posts=await api("/social?count=30");

        document.getElementById("posts").innerHTML=
            (Array.isArray(posts) ? posts : [])
            .map(p=>`
                <article class="card">
                    <div class="post-head">
                        <div style="display:flex;align-items:center;gap:10px">
                            <img
                                class="avatar"
                                data-username="${esc(p.username)}"
                                src="${avatarUrl(p.username)}"
                                style="width:32px;height:32px"
                                onerror="this.style.visibility='hidden'"
                            >

                            <span class="post-user">
                                @${esc(p.username)}
                            </span>
                        </div>

                        <span class="post-time">
                            ${timeAgo(p.timestamp)}
                        </span>
                    </div>

                    <div class="post-body">
                        ${esc(p.message)}
                    </div>
                </article>
            `)
            .join("")
            ||
            '<div class="card muted">No posts yet.</div>';

    }catch(e){
        toast(e.message);
    }
}

async function makePost(){
    const message=
        document.getElementById("postText").value;

    // Mirrors the server's 10–200 character rule.
    if(message.length < 10 || message.length > 200){
        toast("Posts must be 10–200 characters.");
        return;
    }

    try{
        await json("/social",{
            token,
            message
        });

        document.getElementById("postText").value="";

        updateCount();
        loadFeed();

    }catch(e){
        toast(e.message);
    }
}

async function loadUsers(){
    try{
        const users=await api("/users");

        document.getElementById("userList").innerHTML=
            (Array.isArray(users) ? users : [])
            .map(u=>`
                <div class="user">
                    <img
                        class="avatar"
                        data-username="${esc(u)}"
                        src="${avatarUrl(u)}"
                        onerror="this.style.visibility='hidden'"
                    >

                    <div>
                        <b>@${esc(u)}</b>
                    </div>

                    <button
                        class="secondary"
                        style="margin-left:auto"
                        data-username="${esc(u)}"
                    >
                        View
                    </button>
                </div>
            `)
            .join("")
            ||
            '<div class="muted">No users found.</div>';

    }catch(e){
        toast(e.message);
    }
}

// Delegated click handler for "View" buttons in the user list.
// Using data-username + delegation (instead of inline
// onclick="viewUser('...')") avoids ever concatenating a
// user-supplied username into an inline JS string/HTML attribute,
// which could otherwise be broken out of by a username containing
// a quote character.
document.getElementById("userList").addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-username]");
    if(btn){
        viewUser(btn.dataset.username);
    }
});

async function viewUser(name){
    try{
        const u=await api(
            "/user/"+encodeURIComponent(name)
        );

        document.getElementById("modalContent").innerHTML=`
            <h2>@${esc(u.username)}</h2>

            <p class="muted">
                ${esc(u.displayname || "")}
            </p>

            <p>
                ${esc(u.bio || "No bio.")}
            </p>

            <p>
                <b>${u.fries || 0}</b> fries
            </p>

            <button
                class="secondary"
                onclick="closeModal()"
            >
                Close
            </button>
        `;

        document
            .getElementById("modal")
            .classList.remove("hidden");

    }catch(e){
        toast(e.message);
    }
}

function closeModal(){
    document
        .getElementById("modal")
        .classList.add("hidden");
}

async function loadProfile(){
    // Use the live `username` (kept in sync with localStorage),
    // not `me.username` — after a username change, `me` still
    // holds the stale pre-change value until this function
    // reassigns it below, which would otherwise query a
    // username that no longer exists.
    if(!username){
        return;
    }

    try{
        const u=await api(
            "/user/"+encodeURIComponent(username)
        );

        me=u;

        document.getElementById("sideName").textContent=
            "@"+u.username;

        document.getElementById("sideFries").textContent=
            (u.fries || 0)+" fries";

        document.getElementById("displayName").value=
            u.displayname || "";

        document.getElementById("bio").value=
            u.bio || "";

        document.getElementById("newUsername").value=
            u.username || "";

        document.getElementById("pfpPreview").src=
            avatarUrl(u.username);

        document.getElementById("profileCard").innerHTML=`
            <div class="card">
                <div class="profile-head">
                    <img
                        class="avatar"
                        data-username="${esc(u.username)}"
                        src="${avatarUrl(u.username)}"
                    >

                    <div>
                        <h2 style="margin:0">
                            @${esc(u.username)}
                        </h2>

                        <span class="muted">
                            ${esc(u.displayname || "")}
                        </span>
                    </div>
                </div>

                <p>
                    ${esc(u.bio || "No bio yet.")}
                </p>

                <div class="stat">
                    ${u.fries || 0}

                    <span
                        class="muted"
                        style="font-size:14px"
                    >
                        fries
                    </span>
                </div>
            </div>
        `;

    }catch(e){
        toast(e.message);
    }
}

async function changeDisplay(){
    const displayname=
        document.getElementById("displayName").value.trim();

    if(displayname.length < 4){
        toast("Display name must be at least 4 characters.");
        return;
    }

    try{
        await json("/changedisplay",{
            token,
            displayname
        });

        toast("Display name updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}

async function changeBio(){
    try{
        await json("/updatebio",{
            token,
            newbio:
                document.getElementById("bio").value
        });

        toast("Bio updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}

async function changeUsername(){
    const newName=
        document.getElementById("newUsername").value.trim();

    if(newName.length < 4){
        toast("Username must be at least 4 characters.");
        return;
    }

    try{
        await api(
            "/changename?token="+encodeURIComponent(token),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username: newName
                })
            }
        );

        username=newName;

        localStorage.setItem("cami_username",username);

        toast("Username updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}

async function changePassword(){
    const oldpass=document.getElementById("oldPass").value;
    const newpass=document.getElementById("newPass").value;

    if(newpass.length < 4){
        toast("New password must be at least 4 characters.");
        return;
    }

    try{
        await api(
            "/changepass?token="+encodeURIComponent(token),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    oldpass,
                    newpass
                })
            }
        );

        document.getElementById("oldPass").value="";
        document.getElementById("newPass").value="";

        toast("Password updated");

    }catch(e){
        toast(e.message);
    }
}

async function daily(){
    try{
        await json("/daily",{token});

        toast("Daily claimed!");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}

async function transfer(){
    const recipient=
        document.getElementById("recipient").value.trim();

    const count=
        Number(document.getElementById("amount").value);

    if(!recipient){
        toast("Enter a recipient username.");
        return;
    }

    if(!Number.isInteger(count) || count <= 0){
        toast("Enter a whole number of fries greater than 0.");
        return;
    }

    if(recipient.toLowerCase() === (username || "").toLowerCase()){
        toast("You can't transfer fries to yourself.");
        return;
    }

    try{
        await json("/transferfries",{
            token,
            recipientname: recipient,
            count
        });

        document.getElementById("recipient").value="";
        document.getElementById("amount").value="";

        toast("Fries transferred");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}

// Builds the avatar URL for a username. A cache-busting query
// param is appended so that, right after a new picture is
// uploaded, the browser re-fetches it instead of continuing to
// show a cached copy of the old (or empty) image at the same URL.
function avatarUrl(name){
    return `${API}/userpfp/${encodeURIComponent(name)}?v=${Date.now()}`;
}

// Re-points every on-screen avatar <img> for the current user at
// a fresh, cache-busted URL. Called after a successful upload so
// the new picture shows up immediately without a full reload.
function refreshAvatars(){
    if(!username) return;

    document
        .querySelectorAll("img.avatar[data-username]")
        .forEach(img=>{
            if(img.dataset.username.toLowerCase() === username.toLowerCase()){
                img.src = avatarUrl(username);
            }
        });

    const preview=document.getElementById("pfpPreview");
    if(preview){
        preview.src = avatarUrl(username);
    }
}

async function uploadPfp(){
    const fileInput=document.getElementById("pfpFile");
    const file=fileInput.files[0];

    if(!file){
        toast("Choose an image first.");
        return;
    }

    if(!file.type.startsWith("image/")){
        toast("Please choose an image file.");
        return;
    }

    const form=new FormData();
    form.append("token", token);
    form.append("image", file, file.name);

    try{
        // Note: no Content-Type header is set here on purpose —
        // the browser needs to set it itself (including the
        // multipart boundary) for a FormData body. The json()
        // helper always forces "application/json", so it can't
        // be used for this request.
        await api("/setpfp",{
            method:"POST",
            body:form
        });

        fileInput.value="";
        toast("Profile picture updated");
        refreshAvatars();

    }catch(e){
        toast(e.message);
    }
}

document.getElementById("pfpFile").addEventListener("change",(e)=>{
    const file=e.target.files[0];
    if(file){
        document.getElementById("pfpPreview").src=
            URL.createObjectURL(file);
    }
});

async function logout(){
    try{
        await json("/logout",{token});
    }catch{}

    localStorage.removeItem("cami_token");
    localStorage.removeItem("cami_username");

    token=null;
    username=null;
    me=null;

    location.reload();
}

async function start(){
    if(!token){
        document.getElementById("auth").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
        return;
    }

    try{
        if(!username){
            throw new Error("No username saved.");
        }

        me=await api(
            "/user/"+encodeURIComponent(username)
        );

    }catch(e){
        localStorage.removeItem("cami_token");
        localStorage.removeItem("cami_username");

        token=null;
        username=null;
        me=null;

        document.getElementById("auth").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");

        toast("Your session has expired. Please log in again.");
        return;
    }

    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    loadFeed();
    loadProfile();
}

function updateCount(){
    document.getElementById("postCount").textContent=
        document.getElementById("postText").value.length+
        "/200";
}

function timeAgo(t){
    const s=Math.max(
        0,
        Math.floor(Date.now()/1000-t)
    );

    if(s<60) return s+"s ago";
    if(s<3600) return Math.floor(s/60)+"m ago";
    if(s<86400) return Math.floor(s/3600)+"h ago";

    return Math.floor(s/86400)+"d ago";
}

function esc(s){
    return String(s ?? "").replace(
        /[&<>"']/g,
        c=>({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c])
    );
}

document
    .getElementById("postText")
    .addEventListener("input",updateCount);

start();
</script>

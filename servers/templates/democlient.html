```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cami</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0e0e0e;
    --panel:#171717;
    --panel2:#202020;
    --border:#2b2b2b;
    --text:#f5f2ea;
    --muted:#99958c;
    --accent:#ff8c42;
    --accent2:#e8752f;
    --danger:#d95757;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* Auth */

.auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.authbox{
    width:100%;
    max-width:410px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px #0008;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo span{
    color:var(--accent);
}

.authbox .logo{
    margin-bottom:26px;
}

.authbox h2{
    margin:0 0 20px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
}

input,textarea{
    width:100%;
    background:#101010;
    border:1px solid var(--border);
    color:white;
    border-radius:10px;
    padding:12px;
    outline:none;
    transition:.15s;
}

input:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px #ff8c4215;
}

textarea{
    resize:vertical;
    min-height:92px;
}

/* Buttons */

button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    font-weight:750;
    transition:.15s;
}

.primary{
    background:var(--accent);
    color:#111;
}

.primary:hover{
    background:var(--accent2);
    transform:translateY(-1px);
}

.secondary{
    background:var(--panel2);
    color:white;
}

.secondary:hover{
    background:#292929;
}

.danger{
    background:#321b1b;
    color:#ff9292;
}

.danger:hover{
    background:#452020;
}

/* Layout */

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:235px;
    border-right:1px solid var(--border);
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    background:#131313;
}

.sidebar .logo{
    padding:4px 10px 28px;
}

.nav{
    display:grid;
    gap:5px;
}

.nav button{
    background:transparent;
    color:#aaa;
    text-align:left;
    padding:12px 13px;
}

.nav button:hover,
.nav button.active{
    background:var(--panel2);
    color:white;
}

.account{
    margin-top:auto;
    background:var(--panel);
    border:1px solid var(--border);
    padding:13px;
    border-radius:12px;
}

.account b{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
}

.account small{
    color:var(--muted);
}

.main{
    flex:1;
    max-width:900px;
    margin:auto;
    padding:32px;
    width:100%;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    margin:0;
    letter-spacing:-.8px;
}

h2{
    font-size:20px;
    margin:0 0 15px;
}

/* Cards */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    margin-bottom:14px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    align-items:center;
    flex-wrap:wrap;
}

.muted{
    color:var(--muted);
}

/* Feed */

.post-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.post-user{
    font-weight:800;
}

.post-time{
    color:var(--muted);
    font-size:12px;
}

.post-body{
    white-space:pre-wrap;
    margin-top:10px;
    line-height:1.5;
    color:#ddd;
}

/* Users */

.user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--border);
}

.user:last-child{
    border-bottom:0;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#292929;
}

/* Profile */

.profile-head{
    display:flex;
    align-items:center;
    gap:13px;
}

.profile-head .avatar{
    width:58px;
    height:58px;
}

.stat{
    font-size:28px;
    font-weight:850;
}

/* Modal */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modalbox{
    width:100%;
    max-width:390px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    box-shadow:0 20px 60px #0009;
}

/* Toast */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#252525;
    border:1px solid #3a3a3a;
    padding:12px 15px;
    border-radius:10px;
    z-index:20;
    max-width:340px;
    box-shadow:0 10px 30px #0007;
}

/* Mobile */

@media(max-width:700px){
    .sidebar{
        width:64px;
        padding:14px 8px;
    }

    .sidebar .logo{
        font-size:0;
        text-align:center;
        padding:4px 0 20px;
    }

    .sidebar .logo span{
        font-size:25px;
    }

    .nav button{
        font-size:0;
        text-align:center;
        padding:12px;
    }

    .nav button::first-letter{
        font-size:20px;
    }

    .account{
        display:none;
    }

    .main{
        padding:20px 14px;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="auth" class="auth">
    <div class="authbox">
        <div class="logo">Cami<span>.</span></div>

        <h2 id="authTitle">Log in</h2>

        <div class="field">
            <label>Username</label>
            <input id="authUser" autocomplete="username">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="authPass" type="password" autocomplete="current-password">
        </div>

        <button
            class="primary"
            style="width:100%;margin-top:5px"
            onclick="authSubmit()"
        >
            Log in
        </button>

        <p class="muted" style="text-align:center;font-size:13px;margin-bottom:0">
            <span id="authSwitch">Need an account?</span>
            <button
                class="secondary"
                style="padding:5px 8px"
                onclick="toggleAuth()"
            >
                Register
            </button>
        </p>
    </div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

    <aside class="sidebar">

        <div class="logo">Cami<span>.</span></div>

        <nav class="nav">
            <button class="active" onclick="showPage('feed',this)">🏠 Feed</button>
            <button onclick="showPage('users',this)">👥 Users</button>
            <button onclick="showPage('profile',this)">👤 Profile</button>
            <button onclick="showPage('settings',this)">⚙️ Settings</button>
        </nav>

        <div class="account">
            <b id="sideName">-</b>
            <small id="sideFries">0 fries</small>
        </div>

    </aside>


    <main class="main">

        <!-- FEED -->

        <section id="feed" class="page">

            <div class="top">
                <h1>Feed</h1>
                <button class="secondary" onclick="loadFeed()">Refresh</button>
            </div>

            <div class="card">
                <textarea
                    id="postText"
                    maxlength="200"
                    placeholder="What's happening? (10–200 characters)"
                ></textarea>

                <div class="actions">
                    <button class="primary" onclick="makePost()">Post</button>
                    <span class="muted" id="postCount">0/200</span>
                </div>
            </div>

            <div id="posts"></div>

        </section>


        <!-- USERS -->

        <section id="users" class="page hidden">

            <div class="top">
                <h1>Users</h1>
                <button class="secondary" onclick="loadUsers()">Refresh</button>
            </div>

            <div class="card" id="userList"></div>

        </section>


        <!-- PROFILE -->

        <section id="profile" class="page hidden">

            <div class="top">
                <h1>Profile</h1>
                <button class="secondary" onclick="loadProfile()">Refresh</button>
            </div>

            <div id="profileCard"></div>

            <div class="card">
                <h2>Daily fries</h2>
                <p class="muted">Claim 10 fries every 24 hours.</p>
                <button class="primary" onclick="daily()">Claim daily</button>
            </div>

            <div class="card">
                <h2>Transfer fries</h2>

                <div class="row">
                    <input id="recipient" placeholder="Username">
                    <input id="amount" type="number" min="1" placeholder="Amount">
                </div>

                <div class="actions">
                    <button class="primary" onclick="transfer()">Transfer</button>
                </div>
            </div>

        </section>


        <!-- SETTINGS -->

        <section id="settings" class="page hidden">

            <div class="top">
                <h1>Settings</h1>
            </div>

            <div class="card">
                <h2>Display name</h2>
                <input id="displayName">

                <div class="actions">
                    <button class="primary" onclick="changeDisplay()">Save</button>
                </div>
            </div>

            <div class="card">
                <h2>Bio</h2>
                <textarea id="bio" maxlength="200"></textarea>

                <div class="actions">
                    <button class="primary" onclick="changeBio()">Save</button>
                </div>
            </div>

            <div class="card">
                <h2>Username</h2>
                <input id="newUsername">

                <div class="actions">
                    <button class="primary" onclick="changeUsername()">
                        Change username
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>Password</h2>

                <div class="field">
                    <input
                        id="oldPass"
                        type="password"
                        placeholder="Current password"
                    >
                </div>

                <input
                    id="newPass"
                    type="password"
                    placeholder="New password"
                >

                <div class="actions">
                    <button class="primary" onclick="changePassword()">
                        Change password
                    </button>
                </div>
            </div>

            <div class="card">
                <button class="danger" onclick="logout()">Log out</button>
            </div>

        </section>

    </main>

</div>


<!-- USER MODAL -->

<div
    id="modal"
    class="modal hidden"
    onclick="if(event.target===this)closeModal()"
>
    <div class="modalbox" id="modalContent"></div>
</div>


<!-- TOAST -->

<div id="toast" class="toast hidden"></div>


<script>

const API = "https://fries.hackclub.app";

let token = localStorage.getItem("cami_token");
let username = localStorage.getItem("cami_username");

let authRegister = false;
let me = null;


/* API */

async function api(path, options={}){
    const res = await fetch(API + path, options);

    let data = {};

    try{
        data = await res.json();
    }catch{}

    if(!res.ok){
        throw new Error(
            data.error ||
            data.message ||
            `Request failed (${res.status})`
        );
    }

    return data;
}


function json(path, body, method="POST"){
    return api(path,{
        method,
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
    });
}


/* UI */

function toast(msg){
    const el=document.getElementById("toast");

    el.textContent=msg;
    el.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(
        ()=>el.classList.add("hidden"),
        3000
    );
}


/* AUTH */

function toggleAuth(){

    authRegister=!authRegister;

    document.getElementById("authTitle").textContent=
        authRegister ? "Create account" : "Log in";

    document.querySelector(".authbox .primary").textContent=
        authRegister ? "Register" : "Log in";

    document.getElementById("authSwitch").textContent=
        authRegister
        ? "Already have an account?"
        : "Need an account?";

    document.querySelector(".authbox p button").textContent=
        authRegister ? "Log in" : "Register";
}


async function authSubmit(){

    const usernameInput=
        document.getElementById("authUser").value.trim();

    const password=
        document.getElementById("authPass").value;

    if(!usernameInput || !password){
        toast("Enter a username and password.");
        return;
    }

    try{

        const data=await json(
            authRegister ? "/register" : "/login",
            {
                username:usernameInput,
                password
            }
        );

        if(authRegister){
            toast("Account created. You can log in now.");
            toggleAuth();
            return;
        }

        token=data.data || data.token || data;

        if(typeof token==="object"){
            token=token.token;
        }

        if(!token){
            throw new Error("Login did not return a token.");
        }

        username=usernameInput;

        localStorage.setItem("cami_token",token);
        localStorage.setItem("cami_username",username);

        start();

    }catch(e){
        toast(e.message);
    }
}


/* NAVIGATION */

function showPage(id,btn){

    document
        .querySelectorAll(".page")
        .forEach(x=>x.classList.add("hidden"));

    document
        .getElementById(id)
        .classList.remove("hidden");

    document
        .querySelectorAll(".nav button")
        .forEach(x=>x.classList.remove("active"));

    if(btn){
        btn.classList.add("active");
    }

    if(id==="feed")loadFeed();
    if(id==="users")loadUsers();
    if(id==="profile")loadProfile();
}


/* FEED */

async function loadFeed(){

    try{

        const data=await api("/social?count=30");

        const posts=data.data || data;

        document.getElementById("posts").innerHTML=
            (Array.isArray(posts) ? posts : [])
            .map(p=>`

                <article class="card">

                    <div class="post-head">
                        <span class="post-user">
                            @${esc(p.username)}
                        </span>

                        <span class="post-time">
                            ${timeAgo(p.timestamp)}
                        </span>
                    </div>

                    <div class="post-body">
                        ${esc(p.message)}
                    </div>

                </article>

            `)
            .join("")
            ||
            '<div class="card muted">No posts yet.</div>';

    }catch(e){
        toast(e.message);
    }
}


async function makePost(){

    const message=
        document.getElementById("postText").value;

    try{

        await json("/social",{
            token,
            message
        });

        document.getElementById("postText").value="";

        updateCount();
        loadFeed();

    }catch(e){
        toast(e.message);
    }
}


/* USERS */

async function loadUsers(){

    try{

        const data=await api("/users");
        const users=data.data || data;

        document.getElementById("userList").innerHTML=
            (Array.isArray(users) ? users : [])
            .map(u=>`

                <div class="user">

                    <img
                        class="avatar"
                        src="${API}/userpfp/${encodeURIComponent(u)}"
                        onerror="this.style.visibility='hidden'"
                    >

                    <div>
                        <b>@${esc(u)}</b>
                    </div>

                    <button
                        class="secondary"
                        style="margin-left:auto"
                        onclick="viewUser('${escAttr(u)}')"
                    >
                        View
                    </button>

                </div>

            `)
            .join("");

    }catch(e){
        toast(e.message);
    }
}


async function viewUser(name){

    try{

        const data=
            await api("/user/"+encodeURIComponent(name));

        const u=data.data || data;

        document.getElementById("modalContent").innerHTML=`

            <h2>@${esc(u.username)}</h2>

            <p class="muted">
                ${esc(u.displayname || "")}
            </p>

            <p>
                ${esc(u.bio || "No bio.")}
            </p>

            <p>
                <b>${u.fries || 0}</b> fries
            </p>

            <button
                class="secondary"
                onclick="closeModal()"
            >
                Close
            </button>

        `;

        document
            .getElementById("modal")
            .classList.remove("hidden");

    }catch(e){
        toast(e.message);
    }
}


function closeModal(){
    document
        .getElementById("modal")
        .classList.add("hidden");
}


/* PROFILE */

async function loadProfile(){

    if(!me?.username){
        return;
    }

    try{

        const data=
            await api("/user/"+encodeURIComponent(me.username));

        const u=data.data || data;

        me=u;

        document.getElementById("sideName").textContent=
            "@"+u.username;

        document.getElementById("sideFries").textContent=
            (u.fries || 0)+" fries";

        document.getElementById("displayName").value=
            u.displayname || "";

        document.getElementById("bio").value=
            u.bio || "";

        document.getElementById("newUsername").value=
            u.username || "";

        document.getElementById("profileCard").innerHTML=`

            <div class="card">

                <div class="profile-head">

                    <img
                        class="avatar"
                        src="${API}/userpfp/${encodeURIComponent(u.username)}"
                    >

                    <div>
                        <h2 style="margin:0">
                            @${esc(u.username)}
                        </h2>

                        <span class="muted">
                            ${esc(u.displayname || "")}
                        </span>
                    </div>

                </div>

                <p>
                    ${esc(u.bio || "No bio yet.")}
                </p>

                <div class="stat">
                    ${u.fries || 0}
                    <span
                        class="muted"
                        style="font-size:14px"
                    >
                        fries
                    </span>
                </div>

            </div>

        `;

    }catch(e){
        toast(e.message);
    }
}


/* SETTINGS */

async function changeDisplay(){

    try{

        await json("/changedisplay",{
            token,
            displayname:
                document.getElementById("displayName").value
        });

        toast("Display name updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}


async function changeBio(){

    try{

        await json("/updatebio",{
            token,
            newbio:
                document.getElementById("bio").value
        });

        toast("Bio updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}


async function changeUsername(){

    try{

        await api(
            "/changename?token="+encodeURIComponent(token),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username:
                        document.getElementById("newUsername").value
                })
            }
        );

        username=
            document.getElementById("newUsername").value;

        localStorage.setItem("cami_username",username);

        toast("Username updated");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}


async function changePassword(){

    try{

        await api(
            "/changepass?token="+encodeURIComponent(token),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    oldpass:
                        document.getElementById("oldPass").value,

                    newpass:
                        document.getElementById("newPass").value
                })
            }
        );

        toast("Password updated");

    }catch(e){
        toast(e.message);
    }
}


/* ECONOMY */

async function daily(){

    try{

        await json("/daily",{token});

        toast("Daily claimed!");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}


async function transfer(){

    try{

        const count=
            Number(document.getElementById("amount").value);

        await json("/transferfries",{
            token,
            recipientname:
                document.getElementById("recipient").value,
            count
        });

        toast("Fries transferred");
        loadProfile();

    }catch(e){
        toast(e.message);
    }
}


/* LOGOUT */

async function logout(){

    try{
        await json("/logout",{token});
    }catch{}

    localStorage.removeItem("cami_token");
    localStorage.removeItem("cami_username");

    token=null;
    username=null;
    me=null;

    location.reload();
}


/* START */

async function start(){

    if(!token){
        document.getElementById("auth").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
        return;
    }

    try{

        if(!username){
            throw new Error("No username saved.");
        }

        const r=
            await api("/user/"+encodeURIComponent(username));

        me=r.data || r;

    }catch(e){

        localStorage.removeItem("cami_token");
        localStorage.removeItem("cami_username");

        token=null;
        username=null;
        me=null;

        document.getElementById("auth").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");

        toast("Your session has expired. Please log in again.");

        return;
    }

    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    loadFeed();
    loadProfile();
}


/* HELPERS */

function updateCount(){

    document.getElementById("postCount").textContent=
        document.getElementById("postText").value.length+
        "/200";
}


function timeAgo(t){

    const s=Math.max(
        0,
        Math.floor(Date.now()/1000-t)
    );

    if(s<60)return s+"s ago";
    if(s<3600)return Math.floor(s/60)+"m ago";
    if(s<86400)return Math.floor(s/3600)+"h ago";

    return Math.floor(s/86400)+"d ago";
}


function esc(s){

    return String(s ?? "").replace(
        /[&<>"']/g,
        c=>({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c])
    );
}


function escAttr(s){

    return String(s ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


document
    .getElementById("postText")
    .addEventListener("input",updateCount);

start();

</script>

</body>
</html>

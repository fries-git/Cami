<!DOCTYPE html>
<html>
<head>
    <title>Auth Client</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }

        input {
            background: #222;
            color: white;
        }

        button {
            background: #444;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }

        #output {
            margin-top: 20px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<h1>Auth Client</h1>

<h2>Register</h2>
<input id="regUser" placeholder="Username">
<input id="regPass" placeholder="Password" type="password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="loginUser" placeholder="Username">
<input id="loginPass" placeholder="Password" type="password">
<button onclick="login()">Login</button>

<h2>Update Bio</h2>
<input id="bio" placeholder="New bio">
<button onclick="updateBio()">Update Bio</button>

<div id="output">Not logged in</div>

<script>
const API = "http://127.0.0.1:5000";

let userid = localStorage.getItem("userid");

function out(text) {
    document.getElementById("output").innerText = text;
}

async function register() {
    let res = await fetch(API + "/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: document.getElementById("regUser").value,
            password: document.getElementById("regPass").value
        })
    });

    let text = await res.text();

    if (res.status === 201) {
        userid = text;
        localStorage.setItem("userid", userid);
        out("Registered!\nUser ID: " + userid);
    } else {
        out("Register failed: " + res.status);
    }
}

async function login() {
    let res = await fetch(API + "/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: document.getElementById("loginUser").value,
            password: document.getElementById("loginPass").value
        })
    });

    let text = await res.text();

    if (res.status === 200) {
        userid = text;
        localStorage.setItem("userid", userid);
        out("Logged in!\nUser ID: " + userid);
    } else {
        out("Login failed: " + res.status);
    }
}

async function updateBio() {
    if (!userid) {
        out("Not logged in");
        return;
    }

    let res = await fetch(API + "/updatebio", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            uid: userid,
            bio: document.getElementById("bio").value
        })
    });

    out("Bio update response: " + res.status);
}

if (userid) {
    out("Logged in as:\n" + userid);
}
</script>

</body>
</html>
